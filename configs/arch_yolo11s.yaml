# Architecture study: same recipe, one generation newer.
#
# Nothing here differs from main.yaml except the backbone, so any gap is
# attributable to the architecture rather than to the training setup.

model: weights/yolo11s-seg.pt
data: data/processed/cardd_seg/dataset.yaml
task: segment

imgsz: 640
batch: 16
epochs: 100
device: 0
workers: 8
amp: true
patience: 20
save_period: 25
seed: 42

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
perspective: 0.0005
fliplr: 0.5
flipud: 0.0
shear: 0.0
mosaic: 1.0
close_mosaic: 10
mixup: 0.0
copy_paste: 0.0
erasing: 0.0

val: true
plots: true
project: runs
name: arch_yolo11s
