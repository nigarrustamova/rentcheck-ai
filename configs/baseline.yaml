# Baseline: the same architecture, trained from random initialisation.
#
# The only difference from main.yaml is the absence of pretrained weights, so the
# gap between the two measures exactly one thing — what the COCO backbone is worth
# on this dataset. The course brief advises building on pretrained models; this run
# is how we show that advice holds, with our own numbers rather than an assertion.
#
# Note the architecture is given as a .yaml, not a .pt: a .pt would load the
# pretrained weights we are deliberately doing without.

model: yolov8s-seg.yaml
pretrained: false
data: data/processed/cardd_seg/dataset.yaml
task: segment

epochs: 100
imgsz: 640
batch: 16
device: 0
workers: 8
amp: true
patience: 20
save_period: 5
seed: 42

# Identical augmentation to main.yaml — otherwise the comparison would confound
# two changes at once.
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
perspective: 0.0005
fliplr: 0.5
flipud: 0.0
shear: 0.0
mosaic: 1.0
close_mosaic: 10
mixup: 0.0
copy_paste: 0.0
erasing: 0.0

val: true
plots: true
project: runs
name: baseline_scratch
